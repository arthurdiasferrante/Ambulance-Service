spring:
  application:
    name: plinio
  config:
    import: optional:file:.env.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/plinio_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true